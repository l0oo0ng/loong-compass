name: Repository checks and candidate release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Project checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_version.py
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify repository and build delivery
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repository_release.py build
      - name: Publish verified candidate
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: release_assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --prerelease --latest=false --title "$GITHUB_REF_NAME" --notes-file ACCEPTANCE.md
